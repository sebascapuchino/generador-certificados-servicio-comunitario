<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de Certificados - Servicio Comunitario</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,"Liberation Sans",sans-serif;background:#eef0f4;color:#222}
header{background:#8b1a1a;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:900px;margin:20px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 8px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;font-size:15px}
button{margin-top:18px;padding:12px 20px;border:0;border-radius:6px;background:#8b1a1a;color:#fff;font-size:15px;cursor:pointer}
.err{color:#b00;font-size:13px;margin-top:10px;display:none}
#preview{display:none;margin-top:24px;text-align:center}
#stage{margin:14px auto;overflow:hidden}
#cert{position:relative;width:595.5pt;height:842pt;background:#fff;color:#000;font-family:Arial,Helvetica,"Liberation Sans",sans-serif;box-shadow:0 2px 10px #0004;transform-origin:top left;overflow:hidden;text-align:left}
#cert .a{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap}
#cert img{position:absolute}
#cert .b{font-weight:bold}
#flow{position:absolute;left:0;top:451pt;width:100%;text-align:center}
#proj{width:440pt;margin:0 auto;min-height:39pt;font-size:11pt;line-height:13pt;font-weight:bold}
.credit{text-align:center;font-size:12px;color:#666;margin:24px 0}
@media print{
 @page{size:595.5pt 842pt;margin:0}
 html,body{background:#fff;margin:0}
 header,.form,.actions,.credit{display:none!important}
 .wrap{margin:0;max-width:none;padding:0}
 #preview{margin:0;display:block!important}
 #stage{margin:0!important;width:595.5pt!important;height:842pt!important;overflow:visible}
 #cert{box-shadow:none;transform:none!important}
}
</style></head><body>
<header><h1>Generador de Certificados de Servicio Comunitario</h1><p>Herramienta creada por @panwich y @sebasbang_</p></header>
<div class="wrap">
<div class="card form">
<label>Nombres</label><input id="nom" placeholder="(Todos los nombres)">
<label>Apellidos</label><input id="ape" placeholder="(Todos los apellidos)">
<label>Número de cédula</label><input id="ced" inputmode="numeric" placeholder="(Solo números)">
<label>Servicio comunitario realizado</label>
<select id="srv">
<option value="">Seleccione una opción</option>
<option value="0">Plan de sensibilización del patrimonio...</option>
<option value="1">Sensibilización de la identidad histórica...</option>
</select>
<label>Fecha de expedición</label><input type="date" id="fec">
<div class="err" id="err"></div>
<button onclick="generar()">Generar certificado</button>
</div>
<div id="preview">
<div class="actions"><button onclick="descargar()">Descargar PDF (elige "Guardar como PDF")</button></div>
<div id="stage"><div id="cert"></div></div>
</div>
<div class="credit">Herramienta creada por @panwich y @sebasbang_</div>
</div>
<script src="logos.js"></script>
<script>
const SRV=["PLAN DE SENSIBILIZACIÓN DEL PATRIMONIO MATERIAL E INMATERIAL DEL MUSEO SACRO DE CARACAS.","SENSIBILIZACIÓN DE LA IDENTIDAD HISTÓRICA Y EL VÍNCULO COMUNITARIO: EL APRENDIZAJE-SERVICIO COMO CATALIZADOR DE LA MEMORIA CARISMÁTICA EN LA U.E.P. COLEGIO SAN ANTONIO."];
const meses=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const h=new Date();
fec.value=h.getFullYear()+'-'+String(h.getMonth()+1).padStart(2,'0')+'-'+String(h.getDate()).padStart(2,'0');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=v=>'V-'+v.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const titulo0=document.title;let nombreArchivo=titulo0;
const prim=t=>t.trim().split(/\s+/)[0].replace(/[\\\/:*?"<>|]/g,'');
function descargar(){
 document.title=nombreArchivo;
 const r=()=>{document.title=titulo0;removeEventListener('afterprint',r)};
 addEventListener('afterprint',r);
 window.print();
}
function generar(){
 const n=nom.value.trim(),a=ape.value.trim(),c=ced.value.replace(/\D/g,''),s=srv.value,f=fec.value;
 if(!n||!a||c.length<5||s===''||!f){err.style.display='block';err.textContent='Complete todos los campos correctamente.';return;}
 err.style.display='none';
 nombreArchivo='Certificado SC '+prim(n)+' '+prim(a);
 const [y,m,d]=f.split('-').map(Number);
 cert.innerHTML=`
<img src="${L1}" style="left:58.3pt;top:11.2pt;width:134.6pt;height:77.3pt">
<img src="${L2}" style="left:465.75pt;top:26.25pt;width:81.75pt;height:70.5pt">
<div class="a" style="top:148pt;font-size:12pt;line-height:13.5pt">UNIVERSIDAD CENTRAL DE VENEZUELA<br>FACULTAD DE HUMANIDADES Y EDUCACIÓN<br>DIRECCIÓN ESCUELA DE ARTES</div>
<div class="a" style="top:227pt;font-size:12pt;line-height:13.5pt">LA ESCUELA DE ARTES DE LA FACULTAD DE HUMANIDADES Y EDUCACIÓN<br>DE LA UNIVERSIDAD CENTRAL DE VENEZUELA CERTIFICA QUE:</div>
<div class="a b" style="top:295pt;font-size:24pt;line-height:24pt;height:24pt"><span id="nm" style="display:inline-block;font-size:24pt">${esc(a+', '+n)}</span></div>
<div class="a" style="top:333pt;font-size:13pt;line-height:15pt">Cédula de Identidad Nº<br>${fmt(c)}</div>
<div class="a" style="top:400pt;font-size:11pt;line-height:13pt">HA APROBADO EL PROGRAMA DE SERVICIO COMUNITARIO QUE INCLUYE EL<br>CURSO DE INDUCCIÓN Y LAS 120 HORAS DE PRÁCTICAS COMUNITARIAS EN EL<br>PROYECTO</div>
<div id="flow">
 <div id="proj">${SRV[s]}</div>
 <div style="margin-top:11pt;font-size:11pt;line-height:13pt">OBTENIENDO LA CALIFICACIÓN</div>
 <div class="b" style="font-size:12pt;line-height:13pt">APROBADO</div>
 <div style="margin-top:13pt;font-size:11pt;line-height:13pt;white-space:nowrap">CONSTANCIA QUE SE EXPIDE EN LA CIUDAD UNIVERSITARIA DE CARACAS A LOS ${d}<br>DÍAS DEL MES DE ${meses[m-1]} DE ${y}</div>
</div>
<div class="a" style="top:654.5pt;font-size:11pt;line-height:12pt">PROF. ELÍAS CASTRO<br>DIRECTOR</div>
<div class="a" style="top:691.5pt;font-size:12pt;line-height:13pt">____________________________________________________________</div>
<div class="a" style="top:716.5pt;font-size:9pt;line-height:12pt"><b>CIUDAD UNIVERSITARIA DE CARACAS, PATRIMONIO DE LA HUMANIDAD: 2025, VIGÉSIMO QUINTO<br>ANIVERSARIO DE LA DECLARACIÓN DE LA UNESCO</b><br>DIRECCIÓN: Escuela de Artes, Edif. Residencias de la Escuela de Estadística, Ciudad Universitaria.<br>TELFS: 0212-6052833/2928 – CORREO ELECTRÓNICO: artesfheucv@gmail.com</div>`;
 preview.style.display='block';
 cert.style.transform='none';
 const e=document.getElementById('nm');let sz=24;
 while(e.offsetWidth>480*96/72&&sz>14){sz-=0.5;e.style.fontSize=sz+'pt';}
 ajustar();
 preview.scrollIntoView({behavior:'smooth'});
}
function ajustar(){
 const W=595.5*96/72,H=842*96/72,av=Math.min(1,(stage.parentElement.clientWidth-4)/W);
 cert.style.transform=`scale(${av})`;stage.style.width=W*av+'px';stage.style.height=H*av+'px';
}
addEventListener('resize',()=>{if(cert.innerHTML)ajustar()});
</script></body></html>
