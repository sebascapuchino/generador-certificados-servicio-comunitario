<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador de Certificados - Servicio Comunitario</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,"Liberation Sans",sans-serif;background:#eef0f4;color:#222}
header{background:#8b1a1a;color:#fff;padding:18px;text-align:center}
header h1{margin:0;font-size:20px}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:900px;margin:20px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 8px #0002}
label{display:block;margin:12px 0 4px;font-weight:bold;font-size:14px}
input,select{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;font-size:15px}
button{margin-top:18px;padding:12px 20px;border:0;border-radius:6px;background:#8b1a1a;color:#fff;font-size:15px;cursor:pointer}
.err{color:#b00;font-size:13px;margin-top:10px;display:none}
#preview{display:none;margin-top:24px;text-align:center}
#stage{margin:14px auto;overflow:hidden}
#cert{position:relative;width:595.5pt;height:842pt;background:#fff;color:#000;font-family:Arial,Helvetica,"Liberation Sans",sans-serif;box-shadow:0 2px 10px #0004;transform-origin:top left;overflow:hidden;text-align:left}
#cert .a{position:absolute;left:0;width:100%;text-align:center;white-space:nowrap}
#cert img{position:absolute}
#cert .b{font-weight:bold}
#flow{position:absolute;left:0;top:451pt;width:100%;text-align:center}
#proj{width:440pt;margin:0 auto;min-height:39pt;font-size:11pt;line-height:13pt;font-weight:bold}
.credit{text-align:center;font-size:12px;color:#666;margin:24px 0}
@media print{
 @page{size:595.5pt 842pt;margin:0}
 html,body{background:#fff;margin:0}
 header,.form,.actions,.credit{display:none!important}
 .wrap{margin:0;max-width:none;padding:0}
 #preview{margin:0;display:block!important}
 #stage{margin:0!important;width:595.5pt!important;height:842pt!important;overflow:visible}
 #cert{box-shadow:none;transform:none!important}
}
</style></head><body>
<header><h1>Generador de Certificados de Servicio Comunitario</h1><p>Herramienta creada por @panwich y @sebasbang_</p></header>
<div class="wrap">
<div class="card form">
<label>Nombres</label><input id="nom" placeholder="(Todos los nombres)">
<label>Apellidos</label><input id="ape" placeholder="(Todos los apellidos)">
<label>Número de cédula</label><input id="ced" inputmode="numeric" placeholder="(Solo números)">
<label>Servicio comunitario realizado</label>
<select id="srv">
<option value="">Seleccione una opción</option>
<option value="0">Plan de sensibilización del patrimonio...</option>
<option value="1">Sensibilización de la identidad histórica...</option>
</select>
<label>Fecha de expedición</label><input type="date" id="fec">
<div class="err" id="err"></div>
<button onclick="generar()">Generar certificado</button>
</div>
<div id="preview">
<div class="actions"><button onclick="window.print()">Descargar PDF (elige "Guardar como PDF")</button></div>
<div id="stage"><div id="cert"></div></div>
</div>
<div class="credit">Herramienta creada por @panwich y @sebasbang_</div>
</div>
